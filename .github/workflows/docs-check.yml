name: Documentation integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required files and local Markdown links
        run: python3 scripts/check_repo.py
      - name: Validate shell scripts (syntax only)
        run: |
          bash -n scripts/collect-diagnostics.sh
