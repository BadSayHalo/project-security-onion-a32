name: Bug report
description: Báo lỗi cài đặt hoặc kịch bản lab
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Thành phần
      placeholder: Security Onion Setup / VirtualBox / Zeek / Suricata / SOC
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
      description: Mô tả và chỉ dùng địa chỉ IP lab đã được ẩn danh.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế và log đã làm sạch
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
